<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Command Center</title>
        <link href="output.css" rel="stylesheet">
    </head>
    <body class="min-h-screen bg-gray-900 text-white">
        <div class="flex flex-col items-center justify-center bg-slate-600 rounded-2xl m-4 mt-4 p-4 w-auto max-w-screen">
            <header>
                <h1 class="text-4xl font-bold font-serif text-shadow-white">Personal CS Command Center</h1>
                <h2 class="text-center">Build, Learn, Understand.</h2>
            </header>
        </div>
        <main>
        <div class="flex flex-row gap-3 justify-around">
            <section class="flex flex-col bg-slate-800 rounded-2xl p-4 w-full max-w-100 items-center">
                <h2 class="text-2xl font-bold font-serif text-shadow-white">Projects: 1</h2>
            </section>
             <section class="flex flex-col bg-slate-800 rounded-2xl p-4 w-full max-w-100 items-center">
                <h2 class="text-2xl font-bold font-serif text-shadow-white">Tasks: 3</h2>
            </section>
             <section class="flex flex-col bg-slate-800 rounded-2xl p-4 w-full max-w-100 items-center">
                <h2 class="text-2xl font-bold font-serif text-shadow-white">Streak: 0</h2>
            </section>

        </div>
        <div class="bg-slate-800 rounded-2xl p-8 m-4 flex flex-col gap-4">
            <h2 class="font-bold font-mono text-2xl">Current Project </h1>

            <h3 class="font-semibold font-mono text-xl">CS command Center</h2>
            <div class="w-300 rounded-full bg-gray-700">
                <div class="bg-blue-500 h-full rounded-full w-[20%] text-white">
                    20%
                </div>
            </div>


            <button class="mt-4 bg-gray-400 p-2 rounded-2xl shadow-xl w-auto max-w-40 hover:bg-gray-800">Focus</button>


            

        </div>
        <div class="bg-slate-800 rounded-2xl p-8 m-4 flex flex-col gap-4">

            <h3 class="font-bold font-mono text-2xl">Tasks</h1>

        <section class="bg-gray-500 flex flex-row p-2 m-2 gap-3 rounded-2xl">
            <input type="checkbox">
            <span> Create Basic page structure</span>


        </section>

         <section class="bg-gray-500 flex flex-row p-2 m-2 gap-3 rounded-2xl">
            <input type="checkbox">
            <span> Add project/task data</span>


        </section>

         <section class="bg-gray-500 flex flex-row p-2 m-2 gap-3 rounded-2xl">
            <input type="checkbox">
            <span> Make one interaction work</span>


        </section>
      


        </div>
        
      
      
            


        </main>
        

    </body>
</html>
